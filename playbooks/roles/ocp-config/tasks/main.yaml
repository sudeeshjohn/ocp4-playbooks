---
# tasks file for ocp4 config

- name: Update DHCP server config for shared network
  become: true
  import_tasks: dhcpd_update.yaml
  when: dhcp_shared_network is defined and dhcp_shared_network

- name: Setup Squid proxy server
  import_tasks: squid.yaml
  when: setup_squid_proxy

- name: Extract OCP4 tools
  import_tasks: extract.yaml
  when: release_image_override != ""

- name: Setup time synchronisation with Chrony
  become: true
  import_tasks: chrony.yaml
  when: chronyconfig.enabled

- name: OCP config
  when: inventory_hostname == groups['bastion'][0]
  block:
  - name: Skip config if install workdir exist
    stat:
      path: "{{ workdir }}"
    register: dir_status

  - meta: end_play
    when: dir_status.stat.exists

  - name: Setup openshift workdir
    file:
      path: "{{ workdir }}"
      state: directory
      mode: '0755'

  - name: Generate install-config.yaml
    template:
      src: ../templates/install-config.yaml.j2
      dest: "{{ workdir }}/install-config.yaml"

  - name: backup the install-config.yaml
    copy:
      src: "{{ workdir }}/install-config.yaml"
      dest: "{{ workdir }}/install-config.yaml.back"
      remote_src: yes
      force: yes

  - name: Set disable image policy env prefix
    set_fact:
      disable_image_policy_env: "{{ 'OPENSHIFT_INSTALL_EXPERIMENTAL_DISABLE_IMAGE_POLICY=true ' if qe_only_disable_image_policy else '' }}"

  - name: Generate manifest files
    shell: "{{ disable_image_policy_env }}openshift-install create manifests --log-level {{ log_level }}"
    args:
      chdir: "{{ workdir }}"

  - name: Generate Machine Config Master and Worker nodes
    when:
      - luks is defined and luks.enabled
      - luks.config | length > 0
      - luks.config[0].thumbprint is not none
      - luks.config[0].url is not none
    import_tasks: machineconfig_luks.yaml

  - name: Setup network configuration
    template:
      src: ../templates/cluster-network-03-config.yml.j2
      dest: "{{ workdir }}/manifests/cluster-network-03-config.yml"
    when: cni_network_mtu is defined
 
  - name: Configure RHCOS kernel options via MachineConfig before installation
    when: rhcos_pre_kernel_options | length > 0
    import_tasks: preinstall-kernel.yaml
  
  - name: Remove the machine yaml files
    file:
      path: "{{ item }}"
      state: absent
    with_fileglob:
      - "{{ workdir }}/openshift/99_openshift-cluster-api_master-machines-*.yaml"
      - "{{ workdir }}/openshift/99_openshift-cluster-api_worker-machineset-*.yaml"

  - name: Make the control-plane un-schedulable
    lineinfile:
      path: "{{ workdir }}/manifests/cluster-scheduler-02-config.yml"
      regexp: '^(.*)mastersSchedulable: true'
      line: '\1mastersSchedulable: false'
      backrefs: yes
    when: worker_count|int > 0

  - name: Copy machineconfig files generated from helpernode
    copy:
      src: "{{ item }}"
      dest: "{{ workdir }}/manifests"
      remote_src: yes
    with_fileglob:
      - "/machineconfig/*-chrony-configuration.yaml"
    when: chronyconfig.enabled

  - name: Generate kdump machine configuration
    vars:
      kdump_sysconfig: |
        KDUMP_COMMANDLINE_REMOVE="{{ kdump.commandline_remove }}"
        KDUMP_COMMANDLINE_APPEND="{{ kdump.commandline_append }}"
        KEXEC_ARGS="{{ kdump.kexec_args }}"
        KDUMP_IMG="{{ kdump.kdump_img }}"
      kdump_conf: |
        path {{ kdump.log_path }}
        core_collector makedumpfile -l --message-level 7 -d 31    
      crash_kernel_memory:  "{{ kdump.crash_kernel_memory }}"
      role_n: "{{ item }}"
    template:
      src: ../templates/99-kdump-node-machineconfig.yaml.j2
      dest: "{{ workdir }}/manifests/99-kdump-{{ item }}-node-machineconfig.yaml"
    with_items:
      - worker
      - master
    when: kdump.enabled

  - name: Inject Day-0 SLAAC-disabled MachineConfigs
    copy:
      dest: >-
        {{ workdir }}/openshift/99-{{ item }}-disable-ipv6-slaac.yaml
      mode: "0644"
      content: |
        apiVersion: machineconfiguration.openshift.io/v1
        kind: MachineConfig
        metadata:
          name: 99-{{ item }}-disable-ipv6-slaac
          labels:
            machineconfiguration.openshift.io/role: {{ item }}
        spec:
          config:
            ignition:
              version: 3.4.0
            storage:
              files:
                - path: /etc/sysctl.d/99-disable-ipv6-slaac.conf
                  mode: 0644
                  overwrite: true
                  contents:
                    inline: |
                      # Defaults inherited by interfaces created later (e.g. br-ex).
                      net.ipv6.conf.default.accept_ra = 1
                      net.ipv6.conf.default.autoconf = 0

                      # Apply to interfaces already available.
                      net.ipv6.conf.all.accept_ra = 1
                      net.ipv6.conf.all.autoconf = 0

                      # Explicit OpenShift interfaces. Missing interfaces are non-fatal.
                      -net.ipv6.conf.env2.accept_ra = 1
                      -net.ipv6.conf.env2.autoconf = 0
                      -net.ipv6.conf.br-ex.accept_ra = 1
                      -net.ipv6.conf.br-ex.autoconf = 0
    loop:
      - master
      - worker
    when: disable_ipv6_slaac | default(false) | bool

  - name: Verify Day-0 SLAAC-disabled MachineConfigs exist
    stat:
      path: >-
        {{ workdir }}/openshift/99-{{ item }}-disable-ipv6-slaac.yaml
    loop:
      - master
      - worker
    register: slaac_machineconfig_files
    when: disable_ipv6_slaac | default(false) | bool

  - name: Fail when a Day-0 SLAAC MachineConfig is missing
    fail:
      msg: >-
        SLAAC-disabled MachineConfig was not generated for role
        {{ item.item }}.
    loop: "{{ slaac_machineconfig_files.results | default([]) }}"
    when:
      - disable_ipv6_slaac | default(false) | bool
      - not item.stat.exists

  - name: Create ignition files
    shell: "{{ disable_image_policy_env }}OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE={{ release_image_override }} openshift-install create ignition-configs --log-level {{ log_level }}"
    args:
      chdir: "{{ workdir }}"

  - name: Verify SLAAC configuration is present in master Ignition
    command:
      argv:
        - jq
        - -e
        - >-
          .storage.files[]?
          | select(.path == "/etc/sysctl.d/99-disable-ipv6-slaac.conf")
        - "{{ workdir }}/master.ign"
    changed_when: false
    when: disable_ipv6_slaac | default(false) | bool

  - name: Verify SLAAC configuration is present in worker Ignition
    command:
      argv:
        - jq
        - -e
        - >-
          .storage.files[]?
          | select(.path == "/etc/sysctl.d/99-disable-ipv6-slaac.conf")
        - "{{ workdir }}/worker.ign"
    changed_when: false
    when:
      - disable_ipv6_slaac | default(false) | bool
      - worker_count | int > 0

  - name: Copy update_ignition_bootstrap
    template:
      src: ../files/update_ignition_bootstrap.py
      dest: /tmp/update_ignition_bootstrap.py
      mode: '0755'

  - name: Update bootstrap ignition
    shell: "python3 /tmp/update_ignition_bootstrap.py"
    args:
      chdir: "{{ workdir }}"

  - name: Host ignition files
    become: true
    copy:
      src: "{{ item }}"
      dest: /var/www/html/ignition/
      mode: o+r
    with_fileglob:
      - "{{ workdir }}/*.ign"

  - name: Best effort SELinux repair - Apache
    shell: "restorecon -vR /var/www/html || true"
